name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_federation_rule_id: fdrl_01DzX7KPykgTnFm67WYE6L5j
          anthropic_organization_id: 518043f7-3fc5-470f-ae9a-d7b10e910dd1
          anthropic_service_account_id: svac_014MmMFDhYeXgEBpEmGT119Z
          # anthropic_workspace_id: wrkspc_...  # only needed if the rule covers >1 workspace
